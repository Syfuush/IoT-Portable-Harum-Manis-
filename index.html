<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air & Alcohol Quality Station</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .card { 
      background: #1e293b; 
      padding: 2rem; 
      border-radius: 16px; 
      width: 280px; 
      text-align: center; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); 
    }
    h2 { 
      margin-top: 0; 
      color: #e2e8f0; 
      font-size: 1.2rem; 
    }
    .value { 
      font-size: 3rem; 
      font-weight: bold; 
      margin: 0.5rem 0 0 0; 
      color: #38bdf8; 
    }
    .sub-val { 
      color: #94a3b8; 
      font-size: 1rem; 
      margin-bottom: 1rem; 
    }
    .label { 
      color: #94a3b8; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      font-size: 0.75rem; 
      font-weight: 600; 
    }
    .status { 
      font-weight: bold; 
      font-size: 1rem; 
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- MQ-135 Card -->
    <div class="card">
      <h2>Air Quality (MQ-135)</h2>
      <div class="label">Raw Reading</div>
      <div class="value" id="mq135-value">--</div>
      <div class="sub-val" id="mq135-voltage">0.00 V</div>
      <div class="label">Status: <span class="status" id="mq135-status" style="color:#94a3b8;">Connecting...</span></div>
    </div>

    <!-- MQ-3 Card -->
    <div class="card">
      <h2>Alcohol (MQ-3)</h2>
      <div class="label">Raw Reading</div>
      <div class="value" id="mq3-value" style="color: #f43f5e;">--</div>
      <div class="sub-val" id="mq3-voltage">0.00 V</div>
      <div class="label">Status: <span class="status" id="mq3-status" style="color:#94a3b8;">Connecting...</span></div>
    </div>
  </div>

  <script>
    // Configured for your ESP32's LAN IP address:
    const esp32Ip = "http://192.168.137.222/data";

    async function fetchData() {
      try {
        const res = await fetch(esp32Ip);
        const data = await res.json();
        
        // Update MQ-135 UI
        document.getElementById('mq135-value').innerText = data.mq135_raw;
        document.getElementById('mq135-voltage').innerText = data.mq135_volts + " V";
        const mq135Status = document.getElementById('mq135-status');
        if (data.mq135_raw > 2000) {
          mq135Status.innerText = "Poor / High Gas";
          mq135Status.style.color = "#ef4444";
        } else if (data.mq135_raw > 1200) {
          mq135Status.innerText = "Moderate";
          mq135Status.style.color = "#f59e0b";
        } else {
          mq135Status.innerText = "Good";
          mq135Status.style.color = "#22c55e";
        }

        // Update MQ-3 UI
        document.getElementById('mq3-value').innerText = data.mq3_raw;
        document.getElementById('mq3-voltage').innerText = data.mq3_volts + " V";
        const mq3Status = document.getElementById('mq3-status');
        if (data.mq3_raw > 2500) {
          mq3Status.innerText = "High Alcohol";
          mq3Status.style.color = "#ef4444";
        } else if (data.mq3_raw > 1500) {
          mq3Status.innerText = "Moderate";
          mq3Status.style.color = "#f59e0b";
        } else {
          mq3Status.innerText = "Normal";
          mq3Status.style.color = "#22c55e";
        }

      } catch (err) {
        document.getElementById('mq135-status').innerText = "Offline";
        document.getElementById('mq135-status').style.color = "#ef4444";
        document.getElementById('mq3-status').innerText = "Offline";
        document.getElementById('mq3-status').style.color = "#ef4444";
      }
    }

    // Poll the ESP32 every 2 seconds
    setInterval(fetchData, 2000);
    fetchData();
  </script>

</body>
</html>
